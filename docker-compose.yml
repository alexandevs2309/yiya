services:
  db:
    image: postgres:17-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5435:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.single
    restart: always
    volumes:
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - static_volume:/app/backend/static
      - media_volume:/app/backend/media
      - certs_volume:/app/backend/certs
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      VITE_API_URL: /api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "5173:5173"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: python manage.py run_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      web:
        condition: service_started

  recovery:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: python manage.py recovery_worker
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  static_volume:
  media_volume:
  certs_volume:
